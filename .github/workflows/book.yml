name: Book gym classes

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: gym-booking
  cancel-in-progress: false

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run booker
        env:
          TZ: Australia/Sydney
          GYM_CENTER_ID: ${{ secrets.GYM_CENTER_ID }}
          GYM_EXTERNAL_ID: ${{ secrets.GYM_EXTERNAL_ID }}
          GYM_PERSON_ID: ${{ secrets.GYM_PERSON_ID }}
          GYM_SHEET_ID: ${{ secrets.GYM_SHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python -u booker.py
